<html lang="en">
<head>
    <meta charset="UTF-8">

<body style="font-family: cursive;">
    <h1>Welcome To the World Of React</h1>

    <div id="root"></div>

        <script> 
        //     const root=document.querySelector("#root")

        //     //To create a React Element(React Element is a javascript object)

         //  const h2=React.createElement("h2", {}, "Hello React")

        //    //For rendering the element we need a starting position
        //    ReactDOM.createRoot(root).render(h2)

        //===============================================================
       // 1.Create React Element
        const h1=React.createElement("h1",
        {
            className:'heading-1',
            style:{
                backgroundColor: 'red',
                color:'yellow',
                textDecoration: 'underline'
            }

        },
        "Welcome To React");

          const h2=React.createElement("h2", {}, "Hello React")

        const parentDiv=React.createElement('div',{},h1,h2)
        //2. Create a Root(Starting position)
        const root=ReactDOM.createRoot(document.getElementById('root'))
            root.render(parentDiv)

        
        </script>
